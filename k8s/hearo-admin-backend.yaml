apiVersion: apps/v1
kind: Deployment
metadata:
  name: hearo-admin-backend
  labels:
    app: hearo-admin-backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: hearo-admin-backend
  template:
    metadata:
      labels:
        app: hearo-admin-backend
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
        workload: app
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hearo-admin-backend
          # GitHub Actions가 새 commit SHA 태그로 변경합니다.
          image: 225989329853.dkr.ecr.ap-northeast-2.amazonaws.com/hearo-admin-backend:771fb2002a348ecb066778d3e493c8d8c7babd3b
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1001
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SERVER_PORT
              value: "8083"
            - name: JAVA_TOOL_OPTIONS
              value: -Xms128m -Xmx512m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: hearo-backend-secret
                  key: db-url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hearo-backend-secret
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hearo-backend-secret
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hearo-backend-secret
                  key: jwt-secret
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: CORS_ALLOWED_ORIGINS
              value: https://admin.hearo-hearo.com
            - name: JPA_DDL_AUTO
              value: validate
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi

---
apiVersion: v1
kind: Service
metadata:
  name: hearo-admin-backend
  labels:
    app: hearo-admin-backend
spec:
  type: ClusterIP
  selector:
    app: hearo-admin-backend
  ports:
    - name: http
      port: 8083
      targetPort: http
