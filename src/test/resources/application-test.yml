spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:admin_backend_context_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: test-only-admin-jwt-secret-key-with-more-than-32-bytes

app:
  cors:
    allowed-origins: http://localhost:8082

management:
  health:
    redis:
      enabled: false
