spring:
  application:
    name: hearo-admin-backend
  profiles:
    default: local
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

jwt:
  secret: ${JWT_SECRET}
  admin-validity-in-milliseconds: ${JWT_ADMIN_VALIDITY:7200000}
  admin-refresh-token-validity-in-milliseconds: ${JWT_ADMIN_REFRESH_VALIDITY:43200000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://admin.hearo-hearo.com}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
